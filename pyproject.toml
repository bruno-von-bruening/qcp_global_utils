[project]
# version = "0.1.03"
name = "qcp_global_utils"
dynamic=['version']
description = ''
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies=[
   'ruamel.yaml',
]

[tool.setuptools_scm]
version_file = "src/qcp_global_utils/_version.py" # Make a version file (can the be used by this very package)

[build-system]
requires = ["setuptools>=80", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"
